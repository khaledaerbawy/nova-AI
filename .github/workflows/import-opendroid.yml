name: Import OpenDroid source

# Upstream imports are deliberately manual. Automatic imports on every push
# could overwrite NOVA-specific development changes.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nova-source-import
  cancel-in-progress: false

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NOVA repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch upstream OpenDroid source
        run: git clone --depth 1 https://github.com/JMAN730/opendroid.git /tmp/opendroid

      - name: Copy upstream source and preserve attribution
        run: |
          rsync -a --delete --exclude='.git' --exclude='.github/workflows/***' /tmp/opendroid/ ./
          cat > UPSTREAM.md <<'EOF'
          # Upstream source attribution

          NOVA is being developed from the open-source Android project OpenDroid:
          https://github.com/JMAN730/opendroid

          The upstream project is licensed under Apache License 2.0. The original
          LICENSE and applicable copyright notices are retained in this repository.
          NOVA-specific modifications are maintained separately.
          EOF

      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import OpenDroid upstream source [nova-import-complete]" || echo "No changes to commit"
          git push
