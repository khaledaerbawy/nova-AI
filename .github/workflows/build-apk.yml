name: Build NOVA APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradle.properties'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  # Isolate branch builds; one PR must not cancel another PR's validation.
  group: nova-apk-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout NOVA
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK 36
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Stress-test AutoReply ViewModel cleanup (5 runs)
        run: |
          for attempt in 1 2 3 4 5; do
            echo "AutoReplySettingsScreenTest attempt ${attempt}/5"
            ./gradlew --no-daemon --no-configuration-cache --stacktrace :app:testDebugUnitTest --tests "*AutoReplySettingsScreenTest*" --rerun-tasks
          done


      - name: Run unit tests and build debug APK
        run: ./gradlew --no-daemon --no-configuration-cache --stacktrace testDebugUnitTest assembleDebug

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
